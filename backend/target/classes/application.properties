server.port=8080

# Application Name
spring.application.name=plant-disease-backend

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Storage configuration
file.upload-dir=uploads

# MySQL Database Configuration (Default)
spring.datasource.url=jdbc:mysql://localhost:3306/plant_disease
spring.datasource.username=root
spring.datasource.password=//oppoA11K
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Static resource handling for uploaded leaf images
spring.web.resources.static-locations=classpath:/static/,file:uploads/
